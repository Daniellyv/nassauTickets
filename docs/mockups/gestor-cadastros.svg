<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d" font-family="'Segoe UI', Arial, sans-serif">
  <title id="t">Mockup dos cadastros do gestor</title>
  <desc id="d">Tela de usuários com formulário de novo usuário e tabela de usuários cadastrados com ações; ao lado, a tela de guichês.</desc>
  <rect width="1280" height="720" fill="#f4f7f9"/>
  <rect width="1280" height="64" fill="#0f5c7a"/>
  <text x="30" y="40" font-size="22" font-weight="700" fill="#fff">nassauTickets</text>
  <text x="240" y="40" font-size="16" fill="#fff">Atendimento</text>
  <text x="360" y="40" font-size="16" fill="#fff">Relatórios</text>
  <text x="460" y="40" font-size="16" fill="#fff" text-decoration="underline">Usuários</text>
  <text x="550" y="40" font-size="16" fill="#fff">Guichês</text>

  <text x="40" y="108" font-size="28" font-weight="700" fill="#14212b">Usuários</text>
  <text x="40" y="132" font-size="14" fill="#4a5a67">O sistema admite um único gestor ativo; os demais usuários são atendentes.</text>

  <rect x="40" y="148" width="520" height="380" rx="10" fill="#fff" stroke="#c4d0d8"/>
  <text x="60" y="184" font-size="19" font-weight="700" fill="#14212b">Novo usuário</text>
  <g font-size="14" font-weight="700" fill="#14212b">
    <text x="60" y="214">Nome completo</text><rect x="60" y="222" width="400" height="36" rx="8" fill="#fff" stroke="#4a5a67" stroke-width="2"/>
    <text x="60" y="284">Login</text><rect x="60" y="292" width="400" height="36" rx="8" fill="#fff" stroke="#4a5a67" stroke-width="2"/>
    <text x="60" y="354">Senha inicial (mínimo 8 caracteres)</text><rect x="60" y="362" width="400" height="36" rx="8" fill="#fff" stroke="#4a5a67" stroke-width="2"/>
    <text x="60" y="424">Perfil</text><rect x="60" y="432" width="400" height="36" rx="8" fill="#fff" stroke="#4a5a67" stroke-width="2"/>
  </g>
  <text x="74" y="456" font-size="14" fill="#14212b">Atendente</text>
  <rect x="60" y="484" width="150" height="36" rx="10" fill="#0f5c7a"/>
  <text x="135" y="508" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Criar usuário</text>

  <rect x="590" y="148" width="650" height="190" rx="10" fill="#fff" stroke="#c4d0d8"/>
  <rect x="590" y="148" width="650" height="34" rx="10" fill="#e6eef3"/>
  <g font-size="13" font-weight="700" fill="#14212b"><text x="605" y="170">Nome</text><text x="800" y="170">Login</text><text x="900" y="170">Perfil</text><text x="990" y="170">Situação</text><text x="1080" y="170">Ações</text></g>
  <g font-size="14" fill="#14212b">
    <text x="605" y="212">Gestor do Laboratório</text><text x="800" y="212">gestor</text><text x="900" y="212">Gestor</text><text x="990" y="212">Ativo</text>
    <rect x="1075" y="195" width="150" height="26" rx="8" fill="#fff" stroke="#0f5c7a" stroke-width="2"/><text x="1150" y="213" text-anchor="middle" font-size="12" font-weight="700" fill="#0f5c7a">Redefinir senha</text>
    <text x="605" y="256">Atendente do Laboratório</text><text x="800" y="256">atendente</text><text x="900" y="256">Atendente</text><text x="990" y="256">Ativo</text>
    <rect x="1000" y="239" width="70" height="26" rx="8" fill="#fff" stroke="#0f5c7a" stroke-width="2"/><text x="1035" y="257" text-anchor="middle" font-size="12" font-weight="700" fill="#0f5c7a">Desativar</text>
    <rect x="1075" y="239" width="150" height="26" rx="8" fill="#fff" stroke="#0f5c7a" stroke-width="2"/><text x="1150" y="257" text-anchor="middle" font-size="12" font-weight="700" fill="#0f5c7a">Redefinir senha</text>
    <text x="605" y="300">Maria Souza</text><text x="800" y="300">maria</text><text x="900" y="300">Atendente</text><text x="990" y="300">Inativo</text>
    <rect x="1000" y="283" width="70" height="26" rx="8" fill="#fff" stroke="#0f5c7a" stroke-width="2"/><text x="1035" y="301" text-anchor="middle" font-size="12" font-weight="700" fill="#0f5c7a">Ativar</text>
  </g>

  <text x="590" y="378" font-size="22" font-weight="700" fill="#14212b">Guichês (tela /gestor/guiches)</text>
  <rect x="590" y="392" width="650" height="64" rx="10" fill="#fff" stroke="#c4d0d8"/>
  <text x="610" y="418" font-size="13" font-weight="700" fill="#14212b">Número do novo guichê</text>
  <rect x="610" y="424" width="110" height="26" rx="8" fill="#fff" stroke="#4a5a67" stroke-width="2"/>
  <rect x="740" y="420" width="170" height="34" rx="10" fill="#0f5c7a"/><text x="825" y="442" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Adicionar guichê</text>
  <rect x="590" y="470" width="650" height="120" rx="10" fill="#fff" stroke="#c4d0d8"/>
  <rect x="590" y="470" width="650" height="30" rx="10" fill="#e6eef3"/>
  <g font-size="13" font-weight="700" fill="#14212b"><text x="605" y="490">Guichê</text><text x="800" y="490">Situação</text><text x="1000" y="490">Ações</text></g>
  <g font-size="14" fill="#14212b">
    <text x="605" y="524">Guichê 1</text><text x="800" y="524">Ativo</text><rect x="1000" y="507" width="90" height="26" rx="8" fill="#fff" stroke="#0f5c7a" stroke-width="2"/><text x="1045" y="525" text-anchor="middle" font-size="12" font-weight="700" fill="#0f5c7a">Desativar</text>
    <text x="605" y="560">Guichê 2</text><text x="800" y="560">Ativo</text><rect x="1000" y="543" width="90" height="26" rx="8" fill="#fff" stroke="#0f5c7a" stroke-width="2"/><text x="1045" y="561" text-anchor="middle" font-size="12" font-weight="700" fill="#0f5c7a">Desativar</text>
  </g>
  <text x="40" y="640" font-size="14" fill="#4a5a67">Regras: um único gestor ativo · login único · senha mínima de 8 caracteres · não é possível desativar guichê em atendimento.</text>
</svg>
