<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d" font-family="'Segoe UI', Arial, sans-serif">
  <title id="t">Mockup do totem</title>
  <desc id="d">Tela inicial do totem com três botões grandes: Prioritária, Geral e Retirada de Exames.</desc>
  <rect width="1280" height="720" fill="#f4f7f9"/>
  <text x="640" y="90" text-anchor="middle" font-size="46" font-weight="700" fill="#14212b">Retire sua senha</text>
  <text x="640" y="132" text-anchor="middle" font-size="22" fill="#4a5a67">Toque no tipo de atendimento desejado</text>

  <g>
    <rect x="90" y="170" width="340" height="320" rx="22" fill="#a4161a"/>
    <text x="260" y="290" text-anchor="middle" font-size="80" font-weight="800" fill="#fff">SP</text>
    <text x="260" y="345" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">Prioritária</text>
    <text x="260" y="390" text-anchor="middle" font-size="18" fill="#fff">Idosos, gestantes, pessoas com</text>
    <text x="260" y="414" text-anchor="middle" font-size="18" fill="#fff">deficiência e demais casos</text>
    <text x="260" y="438" text-anchor="middle" font-size="18" fill="#fff">previstos em lei</text>
  </g>
  <g>
    <rect x="470" y="170" width="340" height="320" rx="22" fill="#1b5e20"/>
    <text x="640" y="305" text-anchor="middle" font-size="80" font-weight="800" fill="#fff">SG</text>
    <text x="640" y="360" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">Geral</text>
    <text x="640" y="405" text-anchor="middle" font-size="18" fill="#fff">Atendimento geral</text>
  </g>
  <g>
    <rect x="850" y="170" width="340" height="320" rx="22" fill="#5b2a86"/>
    <text x="1020" y="290" text-anchor="middle" font-size="80" font-weight="800" fill="#fff">SE</text>
    <text x="1020" y="345" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">Retirada de Exames</text>
    <text x="1020" y="390" text-anchor="middle" font-size="18" fill="#fff">Somente para retirar</text>
    <text x="1020" y="414" text-anchor="middle" font-size="18" fill="#fff">resultados de exames</text>
  </g>

  <text x="640" y="555" text-anchor="middle" font-size="18" fill="#4a5a67">Nenhum dado pessoal é solicitado ou armazenado para retirar a senha.</text>

  <rect x="190" y="600" width="900" height="90" rx="12" fill="#fff" stroke="#c4d0d8" stroke-dasharray="6 6"/>
  <text x="640" y="634" text-anchor="middle" font-size="16" fill="#4a5a67">Estados alternativos desta tela</text>
  <text x="640" y="660" text-anchor="middle" font-size="15" fill="#4a5a67">Sistema indisponível: botões desabilitados + "Procure a recepção" · Fora do expediente: mensagem com o horário (07:00–17:00)</text>
  <text x="640" y="680" text-anchor="middle" font-size="15" fill="#4a5a67">Após emitir: número grande (ex.: SG001), tipo, horário e pessoas aguardando; volta sozinha em 30 s</text>
</svg>
